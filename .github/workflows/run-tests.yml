# Continuous integration for @sasjs/core.
#
# Everything runs on the runner - install, scan, audit, lint, and a compile and
# build of the whole library.  Nothing reaches a SAS server.  A red run means the
# library does not install, scan, lint or compile; it does not mean the macros
# behave correctly on a SAS engine.

name: Node.js CI

on:
  pull_request:

# checks: write is what lets the coverage step create and update its check run
permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-22.04
    # Offline steps only: healthy runs take 3-5 minutes.  The backstop stays
    # because `npm ci` and the compile can both stall on a slow mirror.
    timeout-minutes: 15

    strategy:
      matrix:
        # lts/jod is Node 22: @sasjs/cli 6 declares node >=22, and on node 20 npx
        # resolves 4.20.9 instead - an older linter, so a lint failure and a lint
        # pass here are not the ones a developer sees locally.
        node-version: [lts/jod]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets (gitleaks)
        # Same pinned binary the pre-commit hook uses, so the scan is
        # enforced on the server even when a clone has no hooks wired up.
        run: node_modules/.bin/gitleaks detect --redact --no-banner

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      # compile and build, without the deploy: every macro in the target's
      # folders is resolved and concatenated into all.sas and the mc_* bundles,
      # so an unresolvable dependency or a broken %macro fails here.  No server
      # is contacted - this is the same local build a maintainer runs.
      - name: Compile and build every macro
        # teed to a file because the same run prints the compile coverage, which
        # the next step reads rather than recomputing
        run: npx @sasjs/cli cb -t server 2>&1 | tee compile-output.log
        env:
          macroCorePath: .

      - name: Publish compile coverage status
        # Creates the 'SASjs compile coverage' check run, or updates the one this
        # workflow already created for the same commit, so a rebuilt PR shows one
        # status rather than a stack of them.  Report only - it never fails the
        # build, because coverage is a number to watch, not a gate.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const logPath = 'compile-output.log'
            if (!fs.existsSync(logPath)) {
              core.info('no compile output to read')
              return
            }
            // chalk colourises the percentage, so strip escapes before matching
            const log = fs.readFileSync(logPath, 'utf8').replace(/\u001b\[[0-9;]*m/g, '')
            const want = ['Services', 'Jobs', 'Macros', 'Overall']
            const rows = []
            for (const kind of want) {
              const m = new RegExp(kind + ' coverage: (\\d+)/(\\d+) \\((\\d+)%\\)').exec(log)
              if (m) rows.push({ kind, covered: +m[1], total: +m[2], pct: +m[3] })
            }
            if (!rows.length) {
              core.info('the compile log carried no coverage lines')
              return
            }

            const overall = rows.find((r) => r.kind === 'Overall') || rows[rows.length - 1]
            const summary = [
              '| Area | Covered | % |',
              '| --- | --- | --- |',
              ...rows.map((r) => `| ${r.kind} | ${r.covered}/${r.total} | ${r.pct}% |`)
            ].join('\n')

            const name = 'SASjs compile coverage'
            const owner = context.repo.owner
            const repo = context.repo.repo
            const head_sha = context.payload.pull_request.head.sha
            const payload = {
              owner,
              repo,
              name,
              head_sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: `Overall ${overall.covered}/${overall.total} (${overall.pct}%)`,
                summary
              }
            }

            // one status per commit: update the run this workflow created, if any
            const existing = await github.rest.checks.listForRef({
              owner, repo, ref: head_sha, check_name: name, per_page: 1
            })
            const run = (existing.data.check_runs || [])[0]
            if (run) {
              const updated = await github.rest.checks.update({
                ...payload, check_run_id: run.id
              })
              core.info(`updated check run ${updated.data.id}`)
            } else {
              const created = await github.rest.checks.create(payload)
              core.info(`created check run ${created.data.id}`)
            }
