# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every test even if the diff touches only a few
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-22.04
    # Backstop: healthy runs take 3-8 minutes. Without this, a hung step
    # (e.g. the VPN) burns a runner until GitHub's 6h platform timeout.
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [lts/iron]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # The static gates run before the VPN so they still report when the
      # tunnel is down, and so a lint or audit failure fails fast without
      # spending a runner on the VPN install.
      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets (gitleaks)
        # Same pinned binary the pre-commit hook uses, so the scan is
        # enforced on the server even when a clone has no hooks wired up.
        run: node_modules/.bin/gitleaks detect --redact --no-banner

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      # The estate may be reachable from a runner without a tunnel; if it is,
      # the VPN is dead weight and a failed handshake cannot block the run.
      - name: Check the estate without the tunnel
        id: direct
        run: |
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' \
              "${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" = "200" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      # WireGuard, not openvpn3: wg-quick returns as soon as the tunnel is up,
      # where session-start attaches to the session and never returns.  The
      # config comes from the Cloudron WireGuard app and is a secret because it
      # carries the client private key - hence base64, so newlines survive.
      - name: Install WireGuard
        if: steps.direct.outputs.reachable != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools resolvconf

      - name: Write WireGuard config
        if: steps.direct.outputs.reachable != 'true'
        run: |
          sudo mkdir -p /etc/wireguard
          printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
        env:
          WG_CONF: ${{ secrets.WG_CONF }}

      - name: Start WireGuard
        if: steps.direct.outputs.reachable != 'true'
        timeout-minutes: 2
        run: |
          sudo wg-quick up wg0

      # A session that is up is not a session that works: the handshake is what
      # proves the peer answers, and until it completes the tunnel blackholes
      # every packet, DNS included.
      - name: Wait for the WireGuard handshake
        if: steps.direct.outputs.reachable != 'true'
        timeout-minutes: 2
        run: |
          for attempt in $(seq 1 12); do
            hs=$(sudo wg show wg0 latest-handshakes | awk 'NR==1 {print $2}')
            echo "attempt $attempt: latest handshake=[${hs:-none}]"
            if [ -n "$hs" ] && [ "$hs" != "0" ]; then break; fi
            sleep 5
          done
          sudo wg show
          ip -brief addr show wg0

      - name: Check connectivity to the estate
        run: |
          sudo wg show || true
          echo "--- resolv.conf ---"
          cat /etc/resolv.conf
          for attempt in $(seq 1 12); do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' \
              "${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::the estate did not answer HTTP 200 - direct=${{ steps.direct.outputs.reachable }}"
          exit 1

      - name: Fetch SASJS server
        run: curl ${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info

      - name: Install Doxygen
        run: sudo apt-get install doxygen

      # The tokens are minted from the estate's local login, so nothing that
      # expires sits in a secret: an access token lives a day and a refresh
      # token a month, and a job built on those starts failing long after the
      # change that broke it.
      - name: Mint the API tokens
        env:
          SASJS_SERVER_URL: ${{ secrets.SASJS_SERVER_URL }}
          SASJS_USERNAME: ${{ secrets.SASJS_USERNAME }}
          SASJS_PASSWORD: ${{ secrets.SASJS_PASSWORD }}
          # A client id is not a credential - a repository variable is enough.
          # Left unset, an admin login can read the first registered client.
          SASJS_CLIENT: ${{ vars.SASJS_CLIENT }}
        run: python3 .github/scripts/mint-token.py

      - name: Build & Deploy Project to SAS server
        run: npx @sasjs/cli cbd -t server
        env:
          macroCorePath: .

      # A pull request into main is the merge candidate, so it gets every test.
      # Anything else runs only the tests for the macros the diff touched, and
      # falls back to everything when the diff cannot be narrowed (a harness
      # file changed, or no changed macro has a test).
      - name: Decide the test scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FORCE_FULL: ${{ github.event.inputs.full }}
        run: |
          cd "$GITHUB_WORKSPACE"
          full=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_FULL" != "false" ]; then
            full=true
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            full=true
          fi

          if [ "$full" = false ]; then
            git fetch --quiet origin "$BASE_REF" || true
            changed=$(git diff --name-only "origin/$BASE_REF"...HEAD || true)
            echo "--- changed ---"; echo "$changed"
            if echo "$changed" | grep -Eq '^(\.sasjslint|\.github/|sasjs/sasjsconfig\.json|tests/testinit\.sas|tests/testterm\.sas|package(-lock)?\.json)'; then
              echo "harness file changed - running everything"
              full=true
            fi
          fi

          tests=""
          if [ "$full" = false ]; then
            names=$(echo "$changed" | while read -r file; do
              case "$file" in
                tests/*/*.test.sas|tests/*/*.test.*.sas)
                  base=$(basename "$file"); echo "${base%%.test*}" ;;
                */*.sas)
                  basename "$file" .sas ;;
              esac
            done | sort -u)
            for name in $names; do
              if ls tests/*/"$name".test*.sas >/dev/null 2>&1; then tests="$tests $name"; fi
            done
          fi
          tests=$(echo "$tests" | xargs)
          if [ "$full" = false ] && [ -z "$tests" ]; then
            echo "no changed macro has a test - running everything"
            full=true
          fi

          if [ "$full" = true ]; then mode=full; else mode=subset; fi
          echo "mode=$mode"
          echo "tests=$tests"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          # The CLI reads the .env.server written above - CLIENT, ACCESS_TOKEN,
          # REFRESH_TOKEN from the SAS9_4GL_IO_* secrets. Credentials passed as
          # bare environment variables are not read by the adapter.
          CI: true
          MODE: ${{ steps.scope.outputs.mode }}
          TESTS: ${{ steps.scope.outputs.tests }}
        run: |
          agg="$RUNNER_TEMP/results.csv"
          : > "$agg"
          status=0
          collect() {
              if [ -f sasjsresults/testResults.csv ]; then
              tail -n +2 sasjsresults/testResults.csv >> "$agg" || true
            fi
          }
          if [ "$MODE" = "full" ]; then
            npx @sasjs/cli test -t server || status=1
            collect
          else
            for name in $TESTS; do
              echo "::group::sasjs test $name"
              npx @sasjs/cli test "$name" -t server || status=1
              collect
              echo "::endgroup::"
            done
          fi
          cp "$agg" sasjsresults/all-results.csv 2>/dev/null || true
          exit $status

      - name: Comment the results on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ steps.scope.outputs.mode }}
          TESTS: ${{ steps.scope.outputs.tests }}
          RESULTS: sasjsresults/all-results.csv
        run: python3 .github/scripts/test-comment.py

