# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs Core Publish

on:
  push:
    branches:
      - main
  # a release can be re-fired without inventing a commit - useful when a
  # push is skipped for a marker in its message, or when the run fails
  # after the merge has landed
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          npm ci

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      - name: Add credentials
        run: |
          echo "CLIENT=${{secrets.SAS9_4GL_IO_CLIENT}}"> .env.server
          echo "ACCESS_TOKEN=${{secrets.SAS9_4GL_IO_ACCESS_TOKEN}}" >> .env.server
          echo "REFRESH_TOKEN=${{secrets.SAS9_4GL_IO_REFRESH_TOKEN}}" >> .env.server

      - name: Semantic Release
        id: makerelease
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN no longer required: package is published via npm
          # Trusted Publishing (OIDC). The id-token: write permission above
          # allows npm CLI to authenticate to the registry automatically.

      - name: SAS Packages Release
        run: |
          npx @sasjs/cli compile job -s sasjs/utils/create_sas_package.sas -o sasjsbuild -t server
          # need long duration token per https://github.com/sasjs/server/issues/307
          # npx @sasjs/cli run sasjsbuild/jobs/utils/create_sas_package.sas -t server

      - name: Debug app token inputs (no secret values printed)
        if: steps.makerelease.outputs.new_release_published == 'true'
        env:
          APP_ID_VAR: ${{ vars.APP_ID }}
          APP_ID_SECRET: ${{ secrets.APP_ID }}
          APP_KEY_SECRET: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          echo "vars.APP_ID length:            ${#APP_ID_VAR}"
          echo "secrets.APP_ID length:         ${#APP_ID_SECRET}"
          echo "secrets.APP_PRIVATE_KEY length: ${#APP_KEY_SECRET}"

      - name: Generate GitHub App token for docs site
        id: app-token
        if: steps.makerelease.outputs.new_release_published == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: core.github.io

      - name: Update Docs Site
        if: steps.makerelease.outputs.new_release_published == 'true'
        env:
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          npx @sasjs/cli doc -t docsonly
          git clone https://x-access-token:${DOCS_TOKEN}@github.com/sasjs/core.github.io.git
          cd core.github.io
          rm -rf *.html
          rm -rf *.js
          rm -rf *.png
          rm -rf *.dot
          rm -rf *.css
          rm -rf *.svg
          rm -rf search
          cp -R ../sasjsbuild/docs/* .
          ls
          git config user.name sasjs
          git config user.email bot@sasjs.io
          echo 'core.sasjs.io' > CNAME
          git add .
          git commit -m "core pipeline build on $(date +%F:%H:%M:%S)"

      - name: Generate sitemap and publish Docs Site
        if: steps.makerelease.outputs.new_release_published == 'true'
        working-directory: core.github.io
        run: |
          # The pages are committed before the sitemap is generated, so each
          # <lastmod> is the commit date of the page it describes rather than
          # the moment this run started.  The sitemap is committed in the same
          # push as the pages, which is why no sitemap pull request exists.
          python3 ../sasjs/utils/sitemap.py .
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update sitemap"
          git push
          echo "check it out:  https://sasjs.github.io/core.github.io/files.html"
