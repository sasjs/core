# Continuous integration for @sasjs/core.
#
# Everything runs on the runner - install, scan, audit, lint, and a compile and
# build of the whole library.  Nothing reaches a SAS server.  A red run means the
# library does not install, scan, lint or compile; it does not mean the macros
# behave correctly on a SAS engine.

name: Node.js CI

on:
  pull_request:

# pull-requests: write is what lets the coverage step create and update its comment
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-22.04
    # Offline steps only: healthy runs take 3-5 minutes.  The backstop stays
    # because `npm ci` and the compile can both stall on a slow mirror.
    timeout-minutes: 15

    strategy:
      matrix:
        # lts/jod is Node 22: @sasjs/cli 6 declares node >=22, and on node 20 npx
        # resolves 4.20.9 instead - an older linter, so a lint failure and a lint
        # pass here are not the ones a developer sees locally.
        node-version: [lts/jod]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets (gitleaks)
        # Same pinned binary the pre-commit hook uses, so the scan is
        # enforced on the server even when a clone has no hooks wired up.
        run: node_modules/.bin/gitleaks detect --redact --no-banner

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      # compile and build, without the deploy: every macro in the target's
      # folders is resolved and concatenated into all.sas and the mc_* bundles,
      # so an unresolvable dependency or a broken %macro fails here.  No server
      # is contacted - this is the same local build a maintainer runs.
      - name: Compile and build every macro
        run: npx @sasjs/cli cb -t server
        env:
          macroCorePath: .

      - name: Publish compile coverage as a PR comment
        # Reads the coverage report `sasjs compile` writes into the build folder
        # (`coverage.json`), so the figures come from the CLI's own numbers
        # instead of being scraped back out of coloured console output.  The
        # comment is found by its marker and edited, so re-runs and new pushes
        # update one comment rather than stacking a new one on every run.
        # Report only - it never fails the build, because coverage is a number
        # to watch, not a gate.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.payload.pull_request.number
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const marker = '<!-- sasjs-compile-coverage -->'

            // One comment per PR: the marker identifies ours, so the same body
            // is rewritten on a re-run or a new push instead of adding another.
            const findComment = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              })
              return comments.find(
                (comment) => comment.body && comment.body.startsWith(marker)
              )
            }

            const write = async (existing, text) => {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: text
                })
                core.info(`updated comment ${existing.id}`)
              } else {
                const created = await github.rest.issues.createComment({
                  owner, repo, issue_number, body: text
                })
                core.info(`created comment ${created.data.id}`)
              }
            }

            const reportPath = path.join('sasjsbuild', 'coverage.json')
            if (!fs.existsSync(reportPath)) {
              // An existing comment is overwritten rather than left alone: stale
              // figures that still look current are worse than a line saying
              // there are none.  With no comment yet there is nothing to correct.
              core.info(`${reportPath} is absent - the compile produced no coverage report`)
              const existing = await findComment()
              if (existing) {
                await write(
                  existing,
                  [
                    marker,
                    '### SASjs compile coverage',
                    '',
                    `\`sasjs compile\` produced no coverage report on \`${sha}\`, so this run has nothing to measure. See the "Compile and build every macro" step.`
                  ].join('\n')
                )
              }
              return
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            const summary = report.summary || {}
            const files = report.files || {}

            const pct = (area) => (area.total ? `${area.percentage}%` : '-')
            const areas = [
              ['Services', summary.services],
              ['Jobs', summary.jobs],
              ['Macros', summary.macros],
              ['Overall', summary.overall]
            ].filter(([, area]) => area)

            if (!areas.length) {
              core.info('the coverage report carried no summary')
              return
            }

            // "standalone" is a test file with no corresponding macro, not a gap
            const uncovered = Object.keys(files).filter(
              (file) =>
                files[file].Coverage !== 'covered' &&
                files[file].Coverage !== 'standalone'
            )

            const body = [
              marker,
              '### SASjs compile coverage',
              '',
              `Measured by \`sasjs compile\` on \`${sha}\`. This comment is edited in place, so it shows the latest run.`,
              '',
              '| Area | Covered | % |',
              '| --- | --- | --- |',
              ...areas.map(
                ([label, area]) => `| ${label} | ${area.covered}/${area.total} | ${pct(area)} |`
              )
            ]

            if (uncovered.length) {
              const shown = uncovered.slice(0, 300)
              body.push(
                '',
                `<details><summary>${uncovered.length} file(s) with no test</summary>`,
                '',
                '```',
                ...shown,
                ...(uncovered.length > shown.length
                  ? [`... and ${uncovered.length - shown.length} more`]
                  : []),
                '```',
                '',
                '</details>'
              )
            }

            await write(await findComment(), body.join('\n'))
