# Release and publish @sasjs/core in one job.
#
# @sasjs/release decides the version from the conventional commits since the last
# tag, creates the tag and the release, and stamps the version npm will read; a
# commit that cuts no release publishes nothing. The release and the publish stay
# in this one file because npm's trusted publisher is registered against this
# workflow's filename, and because the tarball has to be attested and attached to
# the release it belongs to.

name: SASjs Core Publish

on:
  push:
    branches:
      - main
  # main.yml's release job only runs on a push to main, so nothing on a pull
  # request would prove the invocation: a wrong flag or a renamed output would be
  # discovered after the tag and the release already existed. The dry-run job
  # below classifies the same history without writing anything.
  pull_request:
    branches:
      - main
  # a release can be re-fired without inventing a commit - useful when a
  # push is skipped for a marker in its message, or when the run fails
  # after the merge has landed
  workflow_dispatch:
    inputs:
      sign_version:
        description: >-
          Existing version to sign, e.g. 7.1.5 (it must already be on npm).
          Leave empty to sign the release this run publishes.
        required: false

# read-only by default; the release job asks for the writes it needs, and a job's
# block replaces this one entirely rather than adding to it
permissions: read-all

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC), and the attestation's signature
      attestations: write # actions/attest-build-provenance records the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version is worked out from the tags, so a shallow clone has
          # nothing to classify. Publishing is from main or not at all, so the
          # checkout says so rather than inheriting a dispatcher's ref.
          ref: main
          fetch-depth: 0
          # nothing pushes with this token: the tag and the release are created
          # over the API, and the docs site is pushed with its own app token
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports Trusted Publishing
        # Trusted Publishing needs npm >= 11.5.1. The runner image supplies that
        # with Node 22 and later - the current LTS ships npm 11.19 against a floor
        # of 11.5.1 - so this asserts the requirement instead of installing a
        # toolchain. `npm install` cannot be pinned by hash (unlike pip or go),
        # which is why the scorecard reads every such line as an unpinned
        # dependency whatever version it names; a run on an image with an older
        # npm now fails here, by name, instead of inside the publish.
        run: |
          version=$(npm --version)
          echo "npm $version"
          oldest=$(printf '%s\n%s\n' '11.5.1' "$version" | sort -V | head -n1)
          if [ "$oldest" != '11.5.1' ]; then
            echo "::error::npm $version is older than 11.5.1, which Trusted Publishing needs"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      - name: Add credentials
        run: |
          echo "CLIENT=${{secrets.SAS9_4GL_IO_CLIENT}}"> .env.server
          echo "ACCESS_TOKEN=${{secrets.SAS9_4GL_IO_ACCESS_TOKEN}}" >> .env.server
          echo "REFRESH_TOKEN=${{secrets.SAS9_4GL_IO_REFRESH_TOKEN}}" >> .env.server

      - name: Tag and release, if there is anything to release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # the tool is a devDependency, so the lockfile pins the bytes as well as
        # the version; `released` is false when the commits since the last tag
        # are docs/ci/chore, and true when a release was cut - or when the tag
        # already existed, which is what makes a failed run re-runnable
        run: npm run release -- --host github --release --draft --output "$GITHUB_OUTPUT"

      - name: Decide what to publish
        id: prepare
        env:
          REQUESTED: ${{ github.event.inputs.sign_version }}
        # stamps the tag's version where npm will read it, refuses a tag that is
        # not on main, and asks the registry whether the version is already
        # there. A sign_version dispatch names a version that is already
        # published, so it stamps and reports publish=false - the pack, attest
        # and attach steps below then sign what the registry serves
        run: |
          set -euo pipefail
          args=(--prepare-publish --branch main --output "$GITHUB_OUTPUT")
          if [ -n "$REQUESTED" ]; then args+=(--tag "v${REQUESTED}"); fi
          npm run release -- "${args[@]}"

      - name: Publish the package to npm
        if: steps.prepare.outputs.publish == 'true'
        # `publish` is false when the registry already serves this version, so a
        # re-run after a failed publish finishes the release without a second
        # attempt at the same version. The publish runs here rather than inside
        # an action: the scorecard's Packaging check reads workflows for a known
        # publish command.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --provenance --access public

      - name: Pack the published tarball
        id: pack
        if: steps.prepare.outputs.version != ''
        env:
          RELEASED: ${{ steps.prepare.outputs.version }}
          REQUESTED: ${{ github.event.inputs.sign_version }}
        # `npm pack` with a registry spec downloads the tarball that was published
        # rather than rebuilding one from this checkout, so the bytes that get
        # signed are the bytes a consumer installs. The version comes from what
        # the release actually produced, not from `git describe`, which would
        # answer with the previous tag on a run that published nothing.
        run: |
          version="${REQUESTED:-$RELEASED}"
          mkdir -p dist
          # the registry serves a just-published version after a delay of up to a
          # few minutes, so a single `npm pack` can 404 on the version this very
          # run published; 20 tries at 30s is ten minutes, which outlasts it
          for attempt in $(seq 1 20); do
            if npm pack "@sasjs/core@${version}" --pack-destination dist; then
              break
            fi
            echo "the registry has not served ${version} yet (attempt ${attempt} of 20) - waiting"
            sleep 30
          done
          if ! ls dist/*.tgz > /dev/null 2>&1; then
            echo "::error::could not fetch the published tarball for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Attest the build provenance of that tarball
        id: attest
        if: steps.pack.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tgz'

      - name: Attach the tarball and its provenance to the release
        if: steps.pack.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # the scorecard's Signed-Releases check reads release assets by filename,
        # and only `*.intoto.jsonl` earns the full score, so the bundle - which
        # carries no extension of its own - is renamed to match before upload.
        # Consumers verify with: gh attestation verify <tarball> --repo sasjs/core
        run: |
          cp "$BUNDLE" "dist/provenance-${VERSION}.intoto.jsonl"
          gh release upload "v${VERSION}" dist/*.tgz "dist/provenance-${VERSION}.intoto.jsonl" --clobber
          gh release view "v${VERSION}" --json assets --jq '.assets[].name'

      - name: Publish the release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        # the release is created as a draft, so a version is never advertised
        # before it is installable. The tag exists from the moment the release is
        # created; this is what makes the release visible, and it runs only after
        # the tarball and its attestation are attached to it.
        run: gh release edit "$TAG" --draft=false

      - name: SAS Packages Release
        run: |
          npx @sasjs/cli compile job -s sasjs/utils/create_sas_package.sas -o sasjsbuild -t server
          # need long duration token per https://github.com/sasjs/server/issues/307
          # npx @sasjs/cli run sasjsbuild/jobs/utils/create_sas_package.sas -t server

      - name: Debug app token inputs (no secret values printed)
        if: steps.release.outputs.released == 'true'
        env:
          APP_ID_VAR: ${{ vars.APP_ID }}
          APP_ID_SECRET: ${{ secrets.APP_ID }}
          APP_KEY_SECRET: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          echo "vars.APP_ID length:            ${#APP_ID_VAR}"
          echo "secrets.APP_ID length:         ${#APP_ID_SECRET}"
          echo "secrets.APP_PRIVATE_KEY length: ${#APP_KEY_SECRET}"

      - name: Generate GitHub App token for docs site
        id: app-token
        if: steps.release.outputs.released == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: core.github.io

      - name: Update Docs Site
        if: steps.release.outputs.released == 'true'
        env:
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          npx @sasjs/cli doc -t docsonly
          git clone https://x-access-token:${DOCS_TOKEN}@github.com/sasjs/core.github.io.git
          cd core.github.io
          rm -rf *.html
          rm -rf *.js
          rm -rf *.png
          rm -rf *.dot
          rm -rf *.css
          rm -rf *.svg
          rm -rf search
          cp -R ../sasjsbuild/docs/* .
          ls
          git config user.name sasjs
          git config user.email bot@sasjs.io
          echo 'core.sasjs.io' > CNAME
          git add .
          git commit -m "core pipeline build on $(date +%F:%H:%M:%S)"

      - name: Generate sitemap and publish Docs Site
        if: steps.release.outputs.released == 'true'
        working-directory: core.github.io
        run: |
          # The pages are committed before the sitemap is generated, so each
          # <lastmod> is the commit date of the page it describes rather than
          # the moment this run started.  The sitemap is committed in the same
          # push as the pages, which is why no sitemap pull request exists.
          python3 ../sasjs/utils/sitemap.py .
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update sitemap"
          git push
          echo "check it out:  https://sasjs.github.io/core.github.io/files.html"

  dry-run:
    # what the release job decides, decided without writing anything: this proves
    # the flags and the output keys the steps below read (released, publish,
    # version, skip, tag) on every pull request, rather than on the push that
    # finds out.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - run: npm ci

      - name: The tool runs, and reports the keys the release job reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release.out"
          : > "$out"

          npm run release -- --host github --dry-run --output "$out"
          # the tag is this run's, so the prepare step has nothing to resolve -
          # that is the "cut nothing" path, and it has to report skip=true rather
          # than fail
          npm run release -- --prepare-publish --dry-run --output "$out"

          echo "reported:"
          cat "$out"
          for key in released version tag level skip publish exists; do
            grep -q "^${key}=" "$out" || {
              echo "::error::the tool did not report ${key}, which the release job reads"
              exit 1
            }
          done
