# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    # Backstop: healthy runs take 3-8 minutes. Without this, a hung step
    # (e.g. the VPN) burns a runner until GitHub's 6h platform timeout.
    timeout-minutes: 30

    strategy:
      matrix:
        # lts/jod is Node 22: @sasjs/cli 6 declares node >=22, and on node 20 npx
        # resolves 4.20.9 instead - an older linter, so a lint failure and a lint
        # pass here are not the ones a developer sees locally.
        node-version: [lts/jod]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # The static gates run before the VPN so they still report when the
      # tunnel is down, and so a lint or audit failure fails fast without
      # spending a runner on the VPN install.
      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets (gitleaks)
        # Same pinned binary the pre-commit hook uses, so the scan is
        # enforced on the server even when a clone has no hooks wired up.
        run: node_modules/.bin/gitleaks detect --redact --no-banner

      - name: Audit dependencies (fails on any advisory)
        run: npm audit

      - name: Check code style (aborts if errors found)
        run: npx @sasjs/cli lint

      - name: Write VPN Files
        run: |
          echo "$CA_CRT" > .github/vpn/ca.crt
          echo "$USER_CRT" > .github/vpn/user.crt
          echo "$USER_KEY" > .github/vpn/user.key
          echo "$TLS_KEY" > .github/vpn/tls.key
        shell: bash
        env:
          CA_CRT: ${{ secrets.CA_CRT}}
          USER_CRT: ${{ secrets.USER_CRT }}
          USER_KEY: ${{ secrets.USER_KEY }}
          TLS_KEY: ${{ secrets.TLS_KEY }}

      - name: Chmod VPN files
        run: |
          chmod 600 .github/vpn/ca.crt .github/vpn/user.crt .github/vpn/user.key .github/vpn/tls.key

      - name: Install Open VPN
        run: |
          sudo apt install apt-transport-https
          sudo wget https://swupdate.openvpn.net/repos/openvpn-repo-pkg-key.pub
          sudo apt-key add openvpn-repo-pkg-key.pub
          sudo wget -O /etc/apt/sources.list.d/openvpn3.list https://swupdate.openvpn.net/community/openvpn3/repos/openvpn3-jammy.list
          sudo apt update
          sudo apt install openvpn3=17~betaUb22042+jammy

      - name: Start Open VPN 3
        # session-start can hang indefinitely (VPN endpoint unreachable,
        # auth server down). When it hangs it never errors, so without a
        # step timeout the job sits silent until the platform timeout.
        # Healthy session-start completes in seconds.
        timeout-minutes: 2
        # --background: without it session-start attaches to the session and
        # streams its log, so the step runs until the session ends - which is
        # never, and the job dies on the step timeout having connected.  With
        # it, the command returns as soon as the tunnel is up and the DNS check
        # below confirms it.  --timeout makes a dead endpoint abort by itself
        # rather than relying on the step timeout.
        run: openvpn3 session-start --config .github/vpn/config.ovpn --background --timeout 60

      - name: Check VPN / DNS connectivity
        run: |
          openvpn3 sessions-list || true
          echo "--- resolv.conf ---"
          cat /etc/resolv.conf
          SASJS_HOST=$(echo "${{ secrets.SASJS_SERVER_URL }}" | sed -E 's|https?://([^/:]+).*|\1|')
          echo "--- waiting for DNS resolution of ${SASJS_HOST} ---"
          for i in $(seq 1 12); do
            if getent hosts "${SASJS_HOST}"; then break; fi
            echo "attempt $i: ${SASJS_HOST} not resolvable yet, retrying in 5s"
            sleep 5
          done
          getent hosts "${SASJS_HOST}" || {
            echo "::error::DNS resolution failed for ${SASJS_HOST} - VPN tunnel is likely down"
            exit 1
          }
          echo "--- fetching server info ---"
          curl -sS --retry 5 --retry-all-errors --retry-delay 5 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info"

      - name: Fetch SASJS server
        run: curl ${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info

      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Add client
        run: echo "CLIENT=${{secrets.SAS9_4GL_IO_CLIENT}}"> .env.server

      - name: Add access token
        run: echo "ACCESS_TOKEN=${{secrets.SAS9_4GL_IO_ACCESS_TOKEN}}" >> .env.server

      - name: Add refresh token
        run: echo "REFRESH_TOKEN=${{secrets.SAS9_4GL_IO_REFRESH_TOKEN}}" >> .env.server

      - name: Build & Deploy Project to SAS server
        run: npx @sasjs/cli cbd -t server
        env:
          macroCorePath: .

      - name: Run all tests
        run: npx @sasjs/cli test -t server
        env:
          CI: true
          CLIENT: ${{secrets.CLIENT}}
          SECRET: ${{secrets.SECRET}}
          SAS_USERNAME: ${{secrets.SAS_USERNAME}}
          SAS_PASSWORD: ${{secrets.SAS_PASSWORD}}
          ACCESS_TOKEN: ${{secrets.ACCESS_TOKEN}}
          REFRESH_TOKEN: ${{secrets.REFRESH_TOKEN}}

